# Managed by the config updater - do not change.
config-version: 2

discord:
  # Bot token from https://discord.com/developers/applications
  token: ""

# Texts live in plugins/MCDCBridge/lang/<code>.yml (en and de are included; add your own, e.g. fr.yml).
# A Discord server's language is its "Primary Language" under Server Settings > Community > Overview.
# Only Community servers can set it; other servers always report en-US.
language:
  # Minecraft side (commands, kick messages): a language code like "en" or "de",
  # or "discord" to follow the language of the Discord server.
  minecraft: "en"
  # Discord side (embeds, buttons, modals): "auto" = language of the Discord server,
  # "minecraft" = same as above, or a fixed language code.
  discord: "auto"

whitelist:
  # Channel holding the "request whitelist" button (post it with /dcbridge panel).
  panel-channel-id: ""
  # Channel where staff accept or deny requests.
  review-channel-id: ""
  # Role allowed to review requests. Empty = anyone with the "Manage Server" permission.
  staff-role-id: ""
  # Role a Discord user receives once whitelisted. Empty = no role.
  member-role-id: ""
  # true = skip the review and whitelist immediately.
  auto-approve: false

# Giving a Discord user one of these roles bans their linked Minecraft account (they stay whitelisted);
# taking the role away pardons them. Only users whitelisted through the bot are linked.
moderation:
  ban-role-id: ""
  tempban-role-id: ""
  # Length of a tempban: 30m, 12h or 7d. The role is removed automatically afterwards.
  tempban-duration: "7d"

# Embed colors. The texts are in the language files.
embeds:
  panel: {color: "#5865F2"}
  request-sent: {color: "#FEE75C"}
  review: {color: "#5865F2"}
  approved: {color: "#57F287"}
  already-whitelisted: {color: "#57F287"}
  denied: {color: "#ED4245"}
  invalid-gamertag: {color: "#ED4245"}
  not-found: {color: "#ED4245"}
  invalid-name: {color: "#ED4245"}
  banned: {color: "#ED4245"}
  no-permission: {color: "#ED4245"}
  error: {color: "#ED4245"}

# Button look. style: PRIMARY, SECONDARY, SUCCESS, DANGER. emoji is optional. Labels are in the language files.
buttons:
  request: {style: PRIMARY, emoji: "📝"}
  approve: {style: SUCCESS, emoji: "✅"}
  deny: {style: DANGER, emoji: "❌"}
  # Only shown when Floodgate (Geyser) is installed.
  request-bedrock: {style: SECONDARY, emoji: "🎮"}
